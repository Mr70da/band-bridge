<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Band Bridge: Claude Code on your wrist">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#18233a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddc97"/>
      <stop offset="1" stop-color="#4c8bff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4c8bff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4c8bff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <circle cx="1030" cy="160" r="230" fill="url(#glow)"/>

  <text x="72" y="140" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="#ffffff">Band Bridge</text>
  <rect x="74" y="162" width="150" height="6" rx="3" fill="url(#accent)"/>
  <text x="72" y="216" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="30" fill="#c9d6ee">Claude Code on your wrist.</text>
  <text x="72" y="262" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="20" fill="#7f90ad">Huawei Band 11  ·  Windows  ·  Bluetooth LE  ·  no phone, no Huawei Health</text>

  <!-- the band -->
  <g transform="translate(930 28)">
    <rect x="52" y="-10" width="76" height="40" rx="12" fill="#1c2433"/>
    <rect x="52" y="234" width="76" height="40" rx="12" fill="#1c2433"/>
    <rect x="0" y="22" width="180" height="224" rx="48" fill="#0a0c10" stroke="#34405a" stroke-width="3"/>
    <rect x="12" y="34" width="156" height="200" rx="38" fill="#000"/>
    <text x="90" y="74" text-anchor="middle" font-family="Segoe UI, system-ui, Helvetica, Arial, sans-serif" font-size="14" fill="#8a94a3">band-bridge</text>
    <text x="90" y="108" text-anchor="middle" font-family="Segoe UI, system-ui, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Run tests?</text>
    <rect x="28" y="130" width="124" height="38" rx="19" fill="#3ddc97"/>
    <text x="90" y="155" text-anchor="middle" font-family="Segoe UI, system-ui, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#06210f">Allow</text>
    <rect x="28" y="178" width="124" height="38" rx="19" fill="#1f2733"/>
    <text x="90" y="203" text-anchor="middle" font-family="Segoe UI, system-ui, Helvetica, Arial, sans-serif" font-size="17" fill="#e8ecf1">Deny</text>
  </g>
</svg>
